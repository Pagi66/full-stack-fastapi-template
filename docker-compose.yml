# docker-compose.yml

services:

  db:
    image: postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_DB=${POSTGRES_DB}
      - ADMINER_DEFAULT_USERNAME=${POSTGRES_USER}
      - ADMINER_DEFAULT_PASSWORD=${POSTGRES_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.full-stack-fastapi-template-adminer-http.rule=Host(`adminer.localhost`)
      - traefik.http.routers.full-stack-fastapi-template-adminer-http.entrypoints=http
      - traefik.http.services.full-stack-fastapi-template-adminer.loadbalancer.server.port=8080

  prestart:
    image: backend:latest
    build:
      context: ./backend
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=localhost
      - FRONTEND_HOST=http://localhost:5173
      - ENVIRONMENT=local
      - BACKEND_CORS_ORIGINS=["http://localhost:5173"]
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    image: backend:latest
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=localhost
      - FRONTEND_HOST=http://localhost:5173
      - ENVIRONMENT=local
      - BACKEND_CORS_ORIGINS=["http://localhost:5173"]
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: ./backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.full-stack-fastapi-template-backend.loadbalancer.server.port=8000

      - traefik.http.routers.full-stack-fastapi-template-backend-http.rule=Host(`api.localhost`)
      - traefik.http.routers.full-stack-fastapi-template-backend-http.entrypoints=http

  frontend:
    image: frontend:latest
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://api.localhost
        - NODE_ENV=local
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.full-stack-fastapi-template-frontend.loadbalancer.server.port=80

      - traefik.http.routers.full-stack-fastapi-template-frontend-http.rule=Host(`dashboard.localhost`)
      - traefik.http.routers.full-stack-fastapi-template-frontend-http.entrypoints=http

  mailcatcher:
    image: schickling/mailcatcher
    restart: always
    networks:
      - traefik-public
      - default
    ports:
      - "1025:1025"
      - "1080:1080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.full-stack-fastapi-template-mailcatcher-http.rule=Host(`mailcatcher.localhost`)
      - traefik.http.routers.full-stack-fastapi-template-mailcatcher-http.entrypoints=http
      - traefik.http.services.full-stack-fastapi-template-mailcatcher.loadbalancer.server.port=1080

  proxy:
    image: traefik:3.0
    restart: always
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --api.dashboard=true
    networks:
      - traefik-public
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  app-db-data:

networks:
  traefik-public:
    external: false